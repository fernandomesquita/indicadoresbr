name: Governismo na Câmara (dados abertos)

# Roda sob demanda: baixa os arquivos anuais da Câmara e calcula a taxa de
# governismo por partido (scripts/governismo.py). O resultado sai como
# artefato e num commit na branch dados-governismo; quem roda revisa e
# leva o resultado para a main.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por espaço"
        default: "2019 2020 2021 2022 2023 2024 2025"
        required: true

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar pasta
        run: mkdir -p data/aux/governismo
      - name: Calcular
        run: python3 scripts/governismo.py ${{ github.event.inputs.anos }} 2>&1 | tee data/aux/governismo/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: governismo
          path: data/aux/governismo/
      - name: Publicar resultado na branch dados-governismo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B dados-governismo
          git add -f data/aux/governismo/
          git commit -m "governismo: resultado do cálculo (${{ github.event.inputs.anos }})"
          git push -f origin dados-governismo
